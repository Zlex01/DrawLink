<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawLink – Gemeinsam zeichnen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3ee;color:#252a25;font:15px system-ui,sans-serif;padding:32px 20px}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}h1{font-size:30px;letter-spacing:-1.4px;margin:0}h1 span{color:#43835b}p{color:#71766f;margin:7px 0 0}.status{font-size:13px;color:#71766f;text-align:right}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}input{width:35px;height:35px;padding:2px;border:1px solid #d5d8cf;border-radius:8px;background:white;cursor:pointer}button{margin-left:auto;padding:10px 15px;border:1px solid #d5d8cf;background:transparent;border-radius:8px;color:inherit;cursor:pointer}button:hover{background:#e8e9e0}canvas{display:block;width:100%;aspect-ratio:4/3;background:white;border:1px solid #dce0d6;border-radius:12px;touch-action:none;cursor:crosshair}footer{font-size:12px;color:#777e73;margin-top:13px}button:disabled{opacity:.4;cursor:default}@media(max-width:500px){body{padding:22px 12px}h1{font-size:27px}header{align-items:flex-start}p{font-size:13px}.status{max-width:130px}}
</style>
</head>
<body>
<main>
<header><div><h1>Draw<span>Link</span></h1><p>Eine Fläche. Eure Ideen.</p></div><div class="status" id="status" role="status">Verbindung wird hergestellt …</div></header>
<div class="toolbar"><input type="color" id="color" value="#252a25" aria-label="Stiftfarbe"><label for="color">Stiftfarbe</label><button id="clear" disabled>Alles löschen</button></div>
<canvas id="canvas" width="1200" height="900" aria-label="Gemeinsame Zeichenfläche"></canvas>
<footer>Öffnet denselben Link auf mehreren Geräten und zeichnet los.</footer>
</main>
<script>
const canvas = document.querySelector('#canvas');
const ctx = canvas.getContext('2d');
const status = document.querySelector('#status');
const clear = document.querySelector('#clear');
const color = document.querySelector('#color');
let socket, ready = false, previous = null, pointer = null;
function draw(line) {
  ctx.strokeStyle = line.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(line.x1 * canvas.width, line.y1 * canvas.height);
  ctx.lineTo(line.x2 * canvas.width, line.y2 * canvas.height); ctx.stroke();
}
function connect() {
  const path = location.pathname.startsWith('/drawlink') ? '/drawlink/' : '/';
  socket = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}${path}`);
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.type === 'init') {
      ctx.clearRect(0, 0, canvas.width, canvas.height); message.lines.forEach(draw);
      ready = true; clear.disabled = false;
    }
    if (message.type === 'draw') draw(message);
    if (message.type === 'clear') ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (message.type === 'users') status.textContent = `● Verbunden · ${message.count} online`;
    if (message.type === 'full') { ready = false; status.textContent = 'Fläche voll – bitte alles löschen.'; }
    if (message.type === 'clear') ready = true;
  };
  socket.onclose = () => {
    ready = false; previous = null; pointer = null; clear.disabled = true;
    status.textContent = 'Getrennt · verbinde erneut …'; setTimeout(connect, 1500);
  };
  socket.onerror = () => socket.close();
}
function point(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
    y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)) };
}
function sendLine(a, b) {
  if (ready && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({
    type: 'draw', x1: a.x, y1: a.y, x2: b.x, y2: b.y, color: color.value
  }));
}
canvas.onpointerdown = event => {
  if (!ready || pointer !== null || event.button !== 0) return;
  pointer = event.pointerId; canvas.setPointerCapture(pointer);
  previous = point(event); sendLine(previous, previous);
};
canvas.onpointermove = event => {
  if (!previous || event.pointerId !== pointer) return;
  const next = point(event); sendLine(previous, next); previous = next;
};
function stop(event) { if (event.pointerId === pointer) { previous = null; pointer = null; } }
canvas.onpointerup = stop; canvas.onpointercancel = stop; canvas.onlostpointercapture = stop;
clear.onclick = () => {
  if (socket.readyState === WebSocket.OPEN && confirm('Die Zeichnung für alle löschen?')) socket.send(JSON.stringify({ type: 'clear' }));
};
connect();
</script>
</body>
</html>
